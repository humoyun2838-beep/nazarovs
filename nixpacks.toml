[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = [
  "NODE_ENV=development npm ci --ignore-scripts=true --include=dev",
  "mkdir -p node_modules/better-sqlite3/prebuilds",
  "cp vendor/better-sqlite3/linux-x64.node node_modules/better-sqlite3/prebuilds/linux-x64.node"
]

[start]
cmd = "node scripts/start-server.cjs"
