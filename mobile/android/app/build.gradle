plugins { id 'com.android.application' }
android {
    namespace 'uz.dmed.mobile'
    compileSdk 35
    defaultConfig { applicationId 'uz.dmed.mobile'; minSdk 26; targetSdk 35; versionCode 4; versionName '1.3.0' }
    androidResources { noCompress += ['bin'] }
    buildFeatures { buildConfig true }
    flavorDimensions += 'role'
    productFlavors {
        mijoz { dimension 'role'; applicationIdSuffix '.mijoz'; resValue 'string', 'app_name', 'DMED Mijoz'; buildConfigField 'String', 'START_PATH', '"/nazarov?lang=uz"'; buildConfigField 'String', 'ROLE_COLOR', '"#1458D4"' }
        admin { dimension 'role'; applicationIdSuffix '.admin'; resValue 'string', 'app_name', 'DMED Admin'; buildConfigField 'String', 'START_PATH', '"/admin/login?lang=uz"'; buildConfigField 'String', 'ROLE_COLOR', '"#6539C6"' }
        operator { dimension 'role'; applicationIdSuffix '.operator'; resValue 'string', 'app_name', 'DMED Operator'; buildConfigField 'String', 'START_PATH', '"/operator?lang=uz"'; buildConfigField 'String', 'ROLE_COLOR', '"#087D75"' }
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true; disable 'SetJavaScriptEnabled', 'ObsoleteSdkInt' }
}
