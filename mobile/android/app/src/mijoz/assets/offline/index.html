<!doctype html><html lang="uz"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DMED Oflayn</title><style>body{margin:0;background:#eff5fc;color:#142d50;font:16px system-ui}header{background:linear-gradient(120deg,#1555ce,#6544d7);color:white;padding:25px 20px;border-radius:0 0 28px 28px}main{padding:16px;max-width:900px;margin:auto}header a{color:white}h1{font-size:29px;margin:12px 0}h2{font-size:22px}p{white-space:pre-wrap;line-height:1.7;overflow-wrap:anywhere}a{color:#1555ce;text-decoration:none}article,.card,.notice{display:block;background:white;border:1px solid #d6e2f2;border-radius:19px;padding:17px;margin:12px 0}.card{font-weight:650;box-shadow:0 5px 20px #244b7708}.card small{display:block;color:#5b6f8a;margin-top:7px;font-weight:400}input{box-sizing:border-box;width:100%;padding:14px;border:1px solid #c4d8ed;border-radius:13px;font:inherit}button,.action{display:inline-block;padding:13px;background:#1555ce;border:0;border-radius:12px;color:white;font:inherit;margin:5px 5px 5px 0}video,img{width:100%;border-radius:13px}video{background:#111c2d;min-height:160px}small{color:#59718e}.placeholder{border:1px dashed #b8cbe3;border-radius:12px;padding:20px;background:#f4f8ff;margin:14px 0}#status{font-size:14px}nav{display:flex;gap:15px;flex-wrap:wrap}header p{margin-bottom:0}.chip{font-size:13px;background:#ffffff24;padding:7px 11px;border-radius:20px;display:inline-block}</style><header><span class="chip">DMED AKADEMIYA • OFLAYN</span><h1>Bilim doim yoningizda</h1><nav><a href="#">Bo‘limlar</a><a href="https://nazarovs-production.up.railway.app/nazarov">Onlayn sayt va chat ↗</a></nav><p>Darslar, rasmlar va 360p videolar APK bilan birga keladi. Chat uchun internet kerak.</p></header><main><div id="status" class="notice" role="status">Ma’lumotlar ochilmoqda…</div><div id="content"></div></main><script>
(async()=>{
let state={},currentMedia=[];const catalog=await(await fetch('/catalog.json')).json();const root=document.getElementById('content'),status=document.getElementById('status');
const bySlug=new Map(catalog.materials.map(x=>[x.slug,x]));const sourceLinks=new Map();for(const m of catalog.materials){const match=(m.sourceUrl||'').replace(/-/g,'').match(/([a-f0-9]{32})(?:[?#]|$)/i);if(match)sourceLinks.set(match[1].toLowerCase(),m.slug);}
function el(tag,text){const e=document.createElement(tag);if(text)e.textContent=text;return e;}
async function key(raw){return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw)))).map(n=>n.toString(16).padStart(2,'0')).join('');}
async function media(raw,kind,target){const id=await key(raw);const holder=el('div');target.append(holder);currentMedia.push({holder,id,kind,loaded:false});updateMedia();}
function updateMedia(){for(const item of currentMedia){if(item.loaded||!state.files?.[item.id])continue;item.holder.replaceChildren();const node=el(item.kind==='image'?'img':'a');if(item.kind!=='image'){node.textContent=item.kind==='video'?'▶ Videoni internetsiz ko‘rish':'▤ PDF hujjatni ochish';node.href=(item.kind==='video'?'/play':'/document')+'?id='+item.id;node.className='action';}else{node.src='/media/'+item.id;node.alt='Dars rasmi';node.loading='lazy';}item.holder.append(node);item.loaded=true;}for(const item of currentMedia)if(!item.loaded&&!item.holder.hasChildNodes()){item.holder.className='placeholder';item.holder.textContent=item.kind==='video'?'▶ Video hali yuklanmagan. Yuqoridagi yuklash tugmasini bosing.':'▧ Rasm hali yuklanmagan. Yuklab olingandan keyin internetsiz ko‘rinadi.';}}
function internal(href,label,parent){let slug=href.startsWith('/m/')?href.slice(3).split('?')[0]:null;const match=href.replace(/-/g,'').match(/([a-f0-9]{32})(?:[?#]|$)/i);if(!slug&&match)slug=sourceLinks.get(match[1].toLowerCase());if(slug&&bySlug.has(slug)){const link=el('a',label);link.href='#lesson='+encodeURIComponent(slug);link.className='card';parent.append(link);}else parent.append(el('p',label));}
let renderId=0;
async function render(){const id=++renderId;currentMedia=[];root.replaceChildren();const hash=new URLSearchParams(location.hash.slice(1)),slug=hash.get('lesson'),categoryId=hash.get('section');
if(slug&&bySlug.has(slug)){const lesson=bySlug.get(slug),article=el('article');const back=el('a','← Bo‘limga qaytish');back.href='#section='+lesson.categoryId;article.append(back,el('h2',lesson.title));const download=el('a','↓ Rasm va videolarni yuklab olish');download.className='action';download.href='/download?slug='+encodeURIComponent(slug);if(!state.bundled)article.append(download);article.append(el('p',state.bundled?'✓ Rasm va videolar APK ichida. Internet talab qilinmaydi.':'Matn tayyor. Saqlangan video va rasmlar internet o‘chsa ham qoladi.'));root.append(article);
if(lesson.imageUrl)await media(lesson.imageUrl,'image',article);
for(const raw of lesson.content.split('\n')){if(id!==renderId)return;const line=raw.trim();if(!line||/^(URL Source:|Published Time:|Markdown Content:|Manba:|Get Notion free|Warning:)/i.test(line))continue;
let match=line.match(/^(IMAGE|VIDEO|FILE)::(.+)$/);if(match){await media(match[2].trim(),match[1]==='VIDEO'?'video':match[1]==='FILE'?'file':'image',article);continue;}
match=line.match(/^!\[[^\]]*\]\(([^)]+)\)$/);if(match){await media(match[1],'image',article);continue;}
match=line.match(/^\[([^\]]*)\]\(([^)]+)\)$/);if(match){if(/\.mp4(?:\?|$)/i.test(match[2]))await media(match[2],'video',article);else internal(match[2],match[1],article);continue;}
match=line.match(/^(#{1,6})\s+(.+)$/);article.append(el(match?'h3':'p',match?match[2]:line));}
}else{const search=el('input');search.type='search';search.placeholder='Bo‘lim yoki darsni qidirish';search.setAttribute('aria-label',search.placeholder);root.append(search);const list=el('div');root.append(list);
function show(){list.replaceChildren();const term=search.value.trim().toLowerCase();if(categoryId||term){const items=catalog.materials.filter(m=>(!categoryId||String(m.categoryId)===categoryId)&&(!term||m.title.toLowerCase().includes(term)));list.append(el('h2',categoryId?(catalog.categories.find(c=>String(c.id)===categoryId)?.title||'Darslar'):'Qidiruv natijalari'),el('small',items.length+' ta dars'));for(const m of items){const link=el('a',m.title);link.className='card';link.href='#lesson='+encodeURIComponent(m.slug);list.append(link);}}
else{list.append(el('h2',catalog.categories.length+' ta bo‘lim · '+catalog.materials.length+' ta dars'));for(const c of catalog.categories){const link=el('a','✦ '+c.title);link.className='card';link.href='#section='+c.id;link.append(el('small',catalog.materials.filter(m=>m.categoryId===c.id).length+' ta dars • Matnlar oflayn'));list.append(link);}list.append(el('small','Ichki katalog: '+catalog.version));}}search.oninput=show;show();}}
async function poll(){try{state=await(await fetch('/state.json')).json();if(status.textContent!==state.status)status.textContent=state.status;if(state.catalogVersion&&state.catalogVersion!==catalog.version&&!location.hash){location.reload();return;}updateMedia();}catch{status.textContent='Saqlangan darslar qurilmadan ochilmoqda.';}}
await poll();await render();console.log("DMED_OFFLINE_READY:"+catalog.categories.length+":"+catalog.materials.length);addEventListener('hashchange',()=>render());setInterval(poll,state.bundled?15000:2000);
})().catch(error=>{console.log('DMED_OFFLINE_ERROR:'+String(error));document.getElementById('content').textContent='Ma’lumot ochilmadi. Ilovani qayta oching.'});
</script></html>
