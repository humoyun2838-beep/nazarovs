name: DMED Android APKs
on:
  push:
    branches: [codex/android-apps]
    paths: ['mobile/android/**', '.github/workflows/android-apks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build three debug apps and lint client release
        working-directory: mobile/android
        run: gradle --no-daemon :app:assembleMijozRelease :app:assembleDebug :app:lintMijozRelease
      - name: Test update version and URL policy
        run: |
          mkdir -p /tmp/dmed-policy-tests
          javac -d /tmp/dmed-policy-tests mobile/android/app/src/main/java/uz/dmed/mobile/UpdatePolicy.java mobile/android/tests/UpdatePolicyTest.java
          java -cp /tmp/dmed-policy-tests uz.dmed.mobile.UpdatePolicyTest
      - name: Prepare unsigned APKs and signing tool
        run: |
          mkdir -p android-output
          for role in mijoz; do
            cp "mobile/android/app/build/outputs/apk/$role/release/app-$role-release-unsigned.apk" "android-output/DMED-$role-unsigned.apk"
          done
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android-output/apksigner.jar
          python3 - <<'PY'
          import zipfile,json
          z=zipfile.ZipFile('android-output/DMED-mijoz-unsigned.apk')
          data=json.loads(z.read('assets/offline/catalog.json'))
          assert len(data['categories'])==26 and len(data['materials'])==711
          print('PASS: actual packaged APK contains readable 26-section / 711-lesson catalog')
          PY
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Release build workers before emulator
        working-directory: mobile/android
        run: gradle --stop
      - name: Launch all apps on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan,-HardwareDecoder -cores 2 -memory 2048 -no-snapshot -noaudio -no-boot-anim -dns-server 8.8.8.8,1.1.1.1
          disable-animations: true
          script: |
            bash mobile/android/offline-emulator.sh
            bash mobile/android/smoke-emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DMED-Android-build
          path: |
            android-output/
            mobile/android/app/build/reports/lint-results-*.html
          retention-days: 30
