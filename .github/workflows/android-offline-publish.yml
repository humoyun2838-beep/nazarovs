name: Publish signed offline Android APK
on:
  push:
    branches: [codex/android-apps]
    paths: ['.github/workflows/android-offline-publish.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the exact tested source and a successful emulator run
        run: |
          gh api repos/humoyun2838-beep/nazarovs/actions/runs/39059358859 > tested-run.json
          python3 - <<'PYRUN'
          import json
          r=json.load(open('tested-run.json'));assert r['conclusion']=='success' and r['head_sha']=='52d513810d0be4e49a78c701e5e62189df0f1fea'
          PYRUN
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39059358859
          name: DMED-complete-offline-APK
          path: unsigned
      - name: Reconstruct the exact locally signed APK using public signature bytes
        run: |
          python3 mobile/android/tools/apply-public-signing-patch.py unsigned/android-output/DMED-mijoz-unsigned.apk mobile/android/releases/android-v1.3.0-offline-signature.json DMED-Mijoz.apk
          java -jar unsigned/android-output/apksigner.jar verify --verbose --print-certs DMED-Mijoz.apk > signature-verification.txt
          grep -q '623788e1acb9f40975c24a406fd84443951e38ea085fd02092936478b58d41af' signature-verification.txt
          cp mobile/android/releases/android-v1.3.0-offline-verification.json verification.json
          cp unsigned/android-output/media-completeness.json media-completeness.json
          cp mobile/android/releases/DMED-Mijoz-1.3.0-ORNATISH.txt DMED-Mijoz-ORNATISH.txt
          cp mobile/android/releases/android-v1.3.0-offline-notes.md release-notes.md
      - name: Publish the signed download and verification files
        run: |
          gh release create android-v1.3.0-offline DMED-Mijoz.apk verification.json media-completeness.json DMED-Mijoz-ORNATISH.txt --repo humoyun2838-beep/nazarovs --target 52d513810d0be4e49a78c701e5e62189df0f1fea --title 'DMED Mijoz 1.3.0 — internetsiz darslar va 360p videolar' --notes-file release-notes.md
