name: DMED Admin Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/android-admin.yml']
permissions:
  contents: read
jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and lint Android admin
        working-directory: mobile/android
        run: gradle --no-daemon :app:assembleAdminRelease :app:assembleAdminDebug :app:lintAdminRelease
      - name: Prepare verified package metadata and unsigned release
        run: |
          mkdir -p admin-output
          cp mobile/android/app/build/outputs/apk/admin/release/app-admin-release-unsigned.apk admin-output/DMED-Admin-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" admin-output/apksigner.jar
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging admin-output/DMED-Admin-unsigned.apk > admin-output/package.txt
          grep "package: name='uz.dmed.mobile.admin'.*versionCode='5'.*versionName='1.3.1'" admin-output/package.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Stop build workers before emulator
        working-directory: mobile/android
        run: gradle --stop
      - name: Android 15 admin launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan,-HardwareDecoder -cores 2 -memory 2048 -no-snapshot -noaudio -no-boot-anim -dns-server 8.8.8.8,1.1.1.1
          disable-animations: true
          script: |
            adb install mobile/android/app/build/outputs/apk/admin/debug/app-admin-debug.apk
            adb shell cmd connectivity airplane-mode disable
            adb shell svc wifi enable
            adb shell svc data enable
            for attempt in $(seq 1 45); do
              if adb shell dumpsys connectivity | grep -q VALIDATED; then break; fi
              sleep 2
            done
            adb shell dumpsys connectivity > admin-output/connectivity.txt
            grep -q VALIDATED admin-output/connectivity.txt
            adb logcat -c
            adb shell am start -n uz.dmed.mobile.admin/uz.dmed.mobile.MainActivity
            sleep 20
            adb shell uiautomator dump /sdcard/admin-ui.xml
            adb pull /sdcard/admin-ui.xml admin-output/admin-ui.xml
            adb shell screencap -p /sdcard/admin-launch.png
            adb pull /sdcard/admin-launch.png admin-output/admin-launch.png
            adb logcat -d > admin-output/logcat.txt
            adb shell dumpsys activity activities > admin-output/activity.txt
            grep 'uz.dmed.mobile.admin/uz.dmed.mobile.MainActivity' admin-output/activity.txt
            python3 -c "from pathlib import Path; u=Path('admin-output/admin-ui.xml').read_text(); logs=Path('admin-output/logcat.txt').read_text(); assert 'Login' in u and 'Parol' in u, 'Admin login page did not render'; assert 'FATAL EXCEPTION' not in logs; print('PASS: Android 15 admin login rendered without fatal crash')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DMED-Admin-1.3.1
          path: admin-output/
          retention-days: 30
